##### Benchmarking [[google/benchmark](https://github.com/google/benchmark), [likwid](https://github.com/rrze-hpc/likwid), ...]
<!-- .element: style="text-align:left" -->

```cpp
/**
 * [+] iteration speed (isolation, simplicity)
 * [-] correlaction (bias, noise, codegen, ...)
 */
auto bench(std::invocable auto code, std::integral auto iterations) {
    const auto start = std::chrono::steady_clock::now();  // or perf counters
    for (auto i = 0u; i < iterations; ++i) {              // latency vs throughput
        keep(std::invoke(code));                          // defeat optimizing compiler
    }
    const auto stop = std::chrono::steady_clock::now();
    return (stop - start) / iterations;
}
```

#### `Symbolic Benchmarking`
<!-- .element: style="text-align:left" -->

- **Non-Intrusive** - Benchmark existing binaries, libraries, and assembly without modifying code
<!-- .element: class="fragment" data-fragment-index="0" style="text-align:left; font-size:22px;" -->

- **Complete Path Coverage** - Discover and exercise all relevant execution paths (symbolic exploration)
<!-- .element: class="fragment" data-fragment-index="0" style="text-align:left; font-size:22px;" -->

- **Microarchitectural Control** - "control" relevant hardware state (branch, cache, ...)
<!-- .element: class="fragment" data-fragment-index="0" style="text-align:left; font-size:22px;" -->

- **Statistical Robustness** - Central Limit Theorem → Null Hypothesis (enough random samples will produce a normal distribution of their means → determines statistically significant difference)
<!-- .element: class="fragment" data-fragment-index="0" style="text-align:left; font-size:22px;" -->

- **Native execution** - Execute on real hardware (hardware performance counters)
<!-- .element: class="fragment" data-fragment-index="0" style="text-align:left; font-size:22px;" -->

<!-- .element: style="text-align:left; font-size:26px;" -->

```python
Machine Code                    # C++, Rust, Zig, Assembly, ...
  → Symbolic Exploration        # path0, path1, ..., pathN
     → Data Synthesis           # path0: rdi=[0], mem[addr]=[2], ...
        → Benchmarking Harness  # setup, latency/throughput, teardown
           → Native Execution   # 0b010101010101100100010100111
```

##### Cache-line eviction
<!-- .element: style="text-align:left; font-size:24px; " -->

```cpp
enum class Level { L1, L2, L3, DRAM }; // data-cache
```
<!-- .element: style="text-align:left; font-size:17px;" -->

```cpp
auto refresh(const void* addr, const auto level) {
    assert(addr);
    if constexpr (level == Level::L1) {
        load(addr);                              // L1
        fence();
    } else if constexpr (level == Level::L2) {
        flush(addr);                             // DRAM
        fence();
        prefetch<Level>(addr);                   // PREFETCHT1 hint
    } else if constexpr (level == Level::L3) {
        load(addr);                              // L1
        fence();
        demote(addr);                            // CLDEMOTE hint
    } else {
        flush(addr);                             // DRAM
        fence();
    }
    settle();
}
```
<!-- .element: style="text-align:left; font-size:17px;" -->

```asm
PREFETCHNTA  Non-temporal
PREFETCHT0   Hint into all cache levels (L1 priority)
PREFETCHT1   Hint into L2/L3, lower L1 priority
PREFETCHT2   Hint into L2/L3 with even lower urgency
CLFLUSH{OPT} Flush Cache Line
CLDEMOTE     Hint into more distant level (Sapphire Rapids+)
```
<!-- .element: style="text-align:left; font-size:13px; margin: 0 0;" -->

https://www.intel.com/content/www/us/en/developer/articles/technical/intel-sdm.html

```cpp
find_scan (if/else)             → branch
find_map  (std::unordered_map)  → branch/cache
find_mph  (PEXT + LUT + CMOV)   → cache
```

https://github.com/qlibs/mph

```cpp
auto find_scan(int) noexcept:
  mov eax, edi
  xor ecx, ecx
.Lnext:
  cmp [table + rcx*4], eax
  je  .Lfound
  add ecx, 1
  cmp ecx, N
  jb  .Lnext
.Lfound:
  ret
```
<!-- .element: style="text-align:left; font-size:13px;" -->

```cpp
auto find_map(int) noexcept:
  mov eax, edi
  imul eax, eax, 0x9e3779b1
  shr eax, 24
  mov rcx, [buckets + rax*8]
  .Lchain:
  test rcx, rcx
  je  .Lmiss
  cmp [rcx], eax
  jne .Lnext_link
  mov eax, [rcx + 8]
  ret
.Lnext_link:
  mov rcx, [rcx + 16]
  jmp .Lchain
.Lmiss:
  xor eax, eax
  ret
```
<!-- .element: style="text-align:left; font-size:13px;" -->

```cpp
auto find_mph(int) noexcept:
  mov eax, edi
  pext rax, rax, r9             # parallel extract (-mbmi2)
  lea rcx, [table + rax*4]      # lookup table
  mov eax, [rcx]
  cmovne eax, edx               # conditional move
  ret
```
